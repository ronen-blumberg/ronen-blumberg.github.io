        /* Base styles */
        * {
            margin: 0;

        /* Apply retro effects only to specific elements using a class */

        body {

        /* Move the flickering overlay effect to a pseudo-element on the main content */
        .retro-content::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            animation: flicker 0.3s infinite;
            z-index: -1;
        }
